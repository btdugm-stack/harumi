name = "harumi"
main = "src/index.js"
compatibility_date = "2025-08-01"

# Aset statis (css/js/img) disajikan langsung oleh edge; Worker menangani / dan /api/orders.
assets = { directory = "./public", binding = "ASSETS" }

# Simpanan pesanan — Workers KV.
# Cara membuat namespace (sekali saja):
#   npx wrangler login
#   npx wrangler kv namespace create ORDERS
# Lalu tempel id yang dihasilkan di bawah ini.
[[kv_namespaces]]
binding = "ORDERS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
